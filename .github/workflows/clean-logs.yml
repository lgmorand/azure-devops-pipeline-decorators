name: Clean logs
run-name: Clean workflow run logs older than a week

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * 1' # every Monday

jobs:
 Cleaning:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: igorjs/gh-actions-clean-workflow@v8
        with:
          runs_older_than: 7 
          token: ${{ github.token }}
      - uses: lgmorand/gh-workflow-keepalive@v1
