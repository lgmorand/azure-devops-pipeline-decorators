steps:
- ${{ if eq(variables['gitleaks.enabled'], 'true') }}:
  - task: Bash@3
    displayName: 'Run Gitleaks (Injected)'
    inputs:
      targetType: inline
      workingDirectory: '$(Build.SourcesDirectory)'
      script: |
        set -euo pipefail

        if [ "$(uname -s)" != "Linux" ]; then
          echo "##vso[task.logissue type=error]The Gitleaks decorator requires a Linux agent."
          exit 1
        fi

        case "$(uname -m)" in
          x86_64) architecture="x64" ;;
          aarch64|arm64) architecture="arm64" ;;
          *)
            echo "##vso[task.logissue type=error]Unsupported agent architecture: $(uname -m)"
            exit 1
            ;;
        esac

        version="8.30.1"
        archive="gitleaks_${version}_linux_${architecture}.tar.gz"
        release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
        install_dir="$(mktemp -d "${GITLEAKS_TEMP}/gitleaks.XXXXXX")"
        trap 'rm -rf "$install_dir"' EXIT

        curl --fail --silent --show-error --location --retry 3 \
          "${release_url}/${archive}" --output "${install_dir}/${archive}"
        curl --fail --silent --show-error --location --retry 3 \
          "${release_url}/gitleaks_${version}_checksums.txt" --output "${install_dir}/checksums.txt"

        (
          cd "$install_dir"
          grep -E " ${archive}$" checksums.txt > archive.sha256
          sha256sum --check archive.sha256
          tar -xzf "$archive" gitleaks
        )

        "$install_dir/gitleaks" dir "$GITLEAKS_SOURCE" --redact --no-banner --exit-code 1
    env:
      GITLEAKS_SOURCE: $(Build.SourcesDirectory)
      GITLEAKS_TEMP: $(Agent.TempDirectory)
